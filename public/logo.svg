      <g stroke-width="3.4">
        <ellipse cx="42" cy="29" rx="6.6" ry="3.4" transform="rotate(-22 42 29)" />
        <ellipse cx="86" cy="29" rx="6.6" ry="3.4" transform="rotate(22 86 29)" />
        <ellipse cx="49" cy="19" rx="6.2" ry="3.2" transform="rotate(-34 49 19)" />
        <ellipse cx="79" cy="19" rx="6.2" ry="3.2" transform="rotate(34 79 19)" />
        <ellipse cx="64" cy="14" rx="6.4" ry="3.3" transform="rotate(90 64 14)" />
