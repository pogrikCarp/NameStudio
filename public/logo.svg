      <!-- монограмма NS -->
      <path d="M26 112V60l32 48V60" />
      <path d="M100 71c0-8-8-13-18-13-12 0-18 5-18 13 0 7 7 11 18 11s18 4 18 12c0 8-8 13-19 13-10 0-16-4-18-10" />
