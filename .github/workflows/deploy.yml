name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Create release archive
        run: |
          mkdir -p release/scripts
          cp -r dist release/dist
          cp scripts/deploy.sh release/scripts/deploy.sh
          tar -czf site.tar.gz -C release .

      - name: Copy archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 148.253.213.55
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: site.tar.gz
          target: /tmp/namestudio-deploy
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 148.253.213.55
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            rm -rf /tmp/namestudio-src
            mkdir -p /tmp/namestudio-src
            tar -xzf /tmp/namestudio-deploy/site.tar.gz -C /tmp/namestudio-src
            chmod +x /tmp/namestudio-src/scripts/deploy.sh
            /tmp/namestudio-src/scripts/deploy.sh /tmp/namestudio-src
            rm -rf /tmp/namestudio-src /tmp/namestudio-deploy
